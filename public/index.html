<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blankloom — Wear Art, Not Blanks | Printed Cotton Tees</title>
<meta name="description" content="Heavyweight 220 GSM printed cotton tees, screen printed in small batches. Shop limited streetwear drops from Blankloom.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://blankloom.in/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blankloom">
<meta property="og:title" content="Blankloom — Wear Art, Not Blanks">
<meta property="og:description" content="Heavyweight 220 GSM printed cotton tees, screen printed in small batches. Shop limited streetwear drops.">
<meta property="og:url" content="https://blankloom.in/">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blankloom — Wear Art, Not Blanks">
<meta name="twitter:description" content="Heavyweight 220 GSM printed cotton tees, screen printed in small batches.">

<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>

<a href="#main-content" class="visually-hidden-focusable" style="position:absolute; left:-9999px;">Skip to content</a>

<div class="announce" role="note" aria-label="Site announcement">
  <div id="announce-content"></div>
</div>

<header>
  <a href="index.html" class="logo" aria-label="Blankloom home">
    <span class="mark" aria-hidden="true"></span><span>BLANKLOOM</span>
  </a>
  <nav id="primary-nav" aria-label="Primary navigation"></nav>
  <div class="header-right">
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav">☰</button>
    <button class="icon-btn" aria-label="Wishlist">♡</button>
    <a href="cart.html" class="bag-btn" aria-label="View bag">🛍 <span id="cart-count-label">0 items</span></a>
  </div>
</header>
<nav id="mobile-nav" aria-label="Mobile navigation"></nav>

<main id="main-content">

  <section class="hero" aria-labelledby="hero-heading">
    <div class="hero-copy">
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-heading">
        <span id="hero-headline-top"></span><br>
        <span class="accent" id="hero-headline-accent"></span>
      </h1>
      <p id="hero-description"></p>
      <div class="hero-actions">
        <a href="shop.html" class="btn-primary" id="hero-cta-primary"></a>
        <a href="shop.html" class="btn-outline" id="hero-cta-secondary"></a>
      </div>
      <p class="hero-rating">
        <span class="stars" aria-hidden="true">★★★★★</span>
        <span id="hero-rating-score"></span> <span id="hero-rating-note"></span>
      </p>
    </div>
    <div class="hero-visual">
      <div class="hero-media">
        <div class="grain" aria-hidden="true"></div>
        <div class="hero-badge" id="hero-badge"></div>
        <svg id="hero-media-svg" viewBox="0 0 100 110" role="img" aria-label="Featured print design preview"></svg>
      </div>
      <div class="hero-float-card">
        <div class="swatch" id="float-card-svg"></div>
        <div class="info">
          <b id="float-card-name"></b>
          <div class="meta" id="float-card-meta"></div>
          <div class="price" id="float-card-price"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="stats-bar" aria-label="Product specifications">
    <div class="stats-grid" id="stats-grid"></div>
  </section>

  <section class="section" id="bestsellers">
    <div class="section-head">
      <div>
        <span class="section-eyebrow" id="bestsellers-eyebrow"></span>
        <h2 id="bestsellers-heading"></h2>
      </div>
    </div>
    <div class="grid4" id="bestseller-grid"></div>
  </section>

  <section class="section" aria-labelledby="specs-heading">
    <div class="engineer">
      <div class="engineer-copy">
        <span class="section-eyebrow" id="specs-eyebrow"></span>
        <h2 id="specs-heading" style="font-family:'Chivo',sans-serif; font-size:clamp(24px,3vw,32px); font-weight:800; letter-spacing:-0.02em; margin:0;"></h2>
        <p id="specs-description" style="color:var(--text-soft); font-size:14.5px; margin-top:14px;"></p>
        <ul id="specs-bullets"></ul>
      </div>
      <div class="matrix-table" id="matrix-table" role="table" aria-label="Blankloom vs typical blanks comparison"></div>
    </div>
  </section>

  <section class="section" aria-labelledby="ugc-heading">
    <div class="section-head">
      <div>
        <span class="section-eyebrow" id="ugc-eyebrow"></span>
        <h2 id="ugc-heading"></h2>
      </div>
    </div>
    <div class="ugc-grid" id="ugc-grid"></div>
    <p class="review-line">
      <span class="stars" aria-hidden="true">★★★★★</span>
      <b id="ugc-rating-score"></b> <span id="ugc-rating-note"></span>
    </p>
  </section>

  <section class="teaser" aria-label="Upcoming drop signup">
    <div>
      <p class="teaser-eyebrow"><span class="dot" aria-hidden="true"></span> <span id="teaser-countdown"></span></p>
      <h2 id="teaser-heading"></h2>
      <p id="teaser-description"></p>
    </div>
    <div>
      <form class="teaser-form" id="teaser-form">
        <label for="teaser-email" class="visually-hidden-focusable" style="position:absolute; left:-9999px;">Email address</label>
        <input type="email" id="teaser-email" required>
        <button type="submit" id="teaser-button"></button>
      </form>
      <span class="teaser-note" id="teaser-note"></span>
    </div>
  </section>

</main>

<footer>
  <div class="foot-grid">
    <div class="foot-brand">
      <div class="logo"><span class="mark" aria-hidden="true"></span><span>BLANKLOOM</span></div>
      <p id="footer-description"></p>
      <div class="foot-eco">
        <span style="font-size:18px;" aria-hidden="true">🌿</span>
        <div><b id="footer-eco-title"></b><span id="footer-eco-subtitle"></span></div>
      </div>
    </div>
    <div id="footer-columns" style="display:contents;"></div>
    <div class="foot-col foot-newsletter">
      <h4 id="footer-newsletter-title"></h4>
      <p style="font-size:13.5px; color:var(--text-soft); margin:0 0 4px;" id="footer-newsletter-desc"></p>
      <form id="footer-newsletter-form">
        <label for="footer-newsletter-email" class="visually-hidden-focusable" style="position:absolute; left:-9999px;">Email address</label>
        <input type="email" id="footer-newsletter-email" required>
        <button type="submit" id="footer-newsletter-btn"></button>
      </form>
    </div>
  </div>
  <div class="foot-bottom">
    <span id="footer-copyright"></span>
    <span id="footer-legal"></span>
  </div>
</footer>

<noscript>
  <div style="padding:40px; text-align:center; font-family:sans-serif;">
    <h1>Blankloom — Wear Art, Not Blanks</h1>
    <p>Heavyweight printed cotton tees, screen printed in small batches. Please enable JavaScript to view the full catalog, or visit our <a href="shop.html">catalog page</a>.</p>
  </div>
</noscript>

<script src="js/site-data.js"></script>
<script src="js/product-utils.js"></script>
<script src="js/cart.js"></script>
<script src="js/home-render.js"></script>
</body>
</html>
