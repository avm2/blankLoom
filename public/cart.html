<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — Blankloom</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="swatch"></span>BLANKLOOM</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Catalog</a>
  </nav>
  <div class="header-right">
    <a href="cart.html" class="cart-btn active">BAG · 0<span class="cart-count" id="cart-count"></span></a>
  </div>
</header>

<div class="page-head">
  <h1>Your Bag</h1>
</div>

<div class="cart-page" id="cart-root"></div>

<footer>
  <div class="foot-col logo" style="font-size:18px;"><span class="swatch"></span>BLANKLOOM</div>
  <div class="foot-col">
    <h4>CATALOG</h4>
    <a href="shop.html">All Tees</a>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const root = document.getElementById("cart-root");

    if (cart.length === 0) {
      root.innerHTML = `<div class="empty-cart"><p>Your bag is empty.</p><a href="shop.html" class="btn-primary">Browse the catalog</a></div>`;
      return;
    }

    root.innerHTML = cart.map(item => {
      const p = getProduct(item.id);
      if (!p) return "";
      return `
        <div class="cart-row">
          <div class="thumb">${tshirtSVG(p.print, "70%")}</div>
          <div>
            <div class="name">${p.name}</div>
            <div class="meta">Size ${item.size} · ${p.color}</div>
            <button class="remove" onclick="handleRemove('${item.id}','${item.size}')">Remove</button>
          </div>
          <div class="qty-control">
            <button onclick="handleQty('${item.id}','${item.size}', ${item.qty - 1})">−</button>
            <span>${item.qty}</span>
            <button onclick="handleQty('${item.id}','${item.size}', ${item.qty + 1})">+</button>
          </div>
          <div class="mono">${formatPrice(p.price)}</div>
          <div class="mono" style="font-weight:600;">${formatPrice(p.price * item.qty)}</div>
        </div>
      `;
    }).join("") + `
      <div class="cart-summary">
        <div class="total">Total: ${formatPrice(cartTotal())}</div>
        <a href="checkout.html" class="btn-primary">Checkout</a>
      </div>
    `;
  }

  function handleRemove(id, size) {
    removeFromCart(id, size);
    renderCart();
  }
  function handleQty(id, size, qty) {
    if (qty < 1) { handleRemove(id, size); return; }
    updateQty(id, size, qty);
    renderCart();
  }

  renderCart();
</script>
</body>
</html>
